{% load static i18n technology_icons %}{% technology_icons as technologies %}
<section class="bch-technologies" aria-labelledby="technology-title" data-technologies>
  <div class="bch-tech-heading"><div><p id="technology-title">{% trans 'Technologies for builders' %}</p><span>{% trans 'A world of tools. One place to discover.' %}</span></div><button type="button" data-tech-play hidden aria-pressed="true" aria-label="{% trans 'Pause technology animation' %}" data-pause-label="{% trans 'Pause technology animation' %}" data-play-label="{% trans 'Start technology animation' %}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path data-tech-state d="M9 5v14M15 5v14"/></svg></button></div>
  <div class="bch-tech-window"><div class="bch-tech-track" data-tech-track><div class="bch-tech-group" data-tech-group>{% for technology in technologies %}<button type="button" class="bch-tech-item" data-technology="{{ technology.name }}" aria-pressed="false"><span class="bch-tech-sculpture" style="--tech-column:{{ technology.column }};--tech-row:{{ technology.row }}" aria-hidden="true"><img src="{% static 'app_bch_flow/images/technology-sculptures.webp' %}" width="1374" height="1145" alt="" decoding="async"></span><span>{{ technology.name }}</span></button>{% endfor %}</div></div></div>
  <output class="bch-tech-caption" data-tech-caption aria-live="polite">{% trans 'Explore the technologies behind the software world.' %}</output>
</section>
