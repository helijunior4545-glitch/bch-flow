{% load i18n %}{% get_current_language as CURRENT_LANGUAGE %}{% get_available_languages as AVAILABLE_LANGUAGES %}
<div class="locale-bar"><form action="{% url 'set_language' %}" method="post" class="locale-picker">{% csrf_token %}<input type="hidden" name="next" value="{{ language_next|default:request.get_full_path }}"><label for="language-choice">{% trans 'Language' %}</label><select id="language-choice" name="language" aria-label="{% trans 'Choose language' %}">{% for code,name in AVAILABLE_LANGUAGES %}<option value="{{ code }}" {% if code == CURRENT_LANGUAGE %}selected{% endif %}>{{ name }}</option>{% endfor %}</select><button type="submit">{% trans 'Apply' %}</button></form></div>
