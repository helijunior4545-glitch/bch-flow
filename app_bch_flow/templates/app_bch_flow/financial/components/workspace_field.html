{% load i18n %}
{% if not field.is_hidden %}
<div class="fw-field{% if field.errors %} has-error{% endif %}{% if amount %} fw-field-amount{% endif %}" data-dialog-field>
  <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span class="fw-required" aria-hidden="true">*</span>{% else %}<small>{% trans 'Optional' %}</small>{% endif %}</label>
  <div class="fw-field-control">{{ field }}{% if amount %}<span class="fw-field-unit">{{ asset }}</span>{% endif %}</div>
  {% if field.help_text %}<p class="fw-field-help" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</p>{% endif %}
  {{ field.errors }}
</div>
{% endif %}
